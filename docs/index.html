<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kylo Concierge | RAG Chatbot</title>

  <!-- Google Fonts: a serif display face for the brand feel, a clean sans for body text -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Manrope:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- The whole chat widget lives inside this one card -->
  <main class="chat-card" role="main">

    <!-- ===== HEADER ===== -->
    <header class="chat-header">
      <div class="chat-header__identity">
        <div class="chat-header__avatar" aria-hidden="true">K</div>
        <div class="chat-header__text">
          <h1 class="chat-header__title">Kylo Concierge</h1>
          <p class="chat-header__status">
            <span class="status-dot" aria-hidden="true"></span>
            Online &mdash; ask me anything about Kylo Resort
          </p>
        </div>
      </div>
    </header>

    <!-- Thin decorative horizon line — the "signature" visual detail -->
    <div class="horizon-line" aria-hidden="true"></div>

    <!-- ===== MESSAGES AREA ===== -->
    <!-- Every chat bubble (user + bot) gets added inside #chat-log by script.js -->
    <section class="chat-log" id="chat-log" aria-live="polite" aria-label="Conversation">

      <!-- Bot's first message, already in the HTML so the chat never looks empty -->
      <div class="message message--bot">
        <div class="message__avatar" aria-hidden="true">K</div>
        <div class="message__bubble">
          Welcome to Kylo Resort. I'm your concierge assistant &mdash; ask me about
          rooms, amenities, dining, or anything else about your stay.
        </div>
      </div>

    </section>

    <!-- Loading indicator (three bouncing dots), hidden until a request is in flight -->
    <div class="typing-indicator" id="typing-indicator" hidden>
      <div class="message__avatar" aria-hidden="true">K</div>
      <div class="typing-indicator__bubble">
        <span></span><span></span><span></span>
      </div>
    </div>

    <!-- ===== INPUT AREA ===== -->
    <form class="chat-input" id="chat-form" autocomplete="off">
      <input
        type="text"
        id="user-input"
        class="chat-input__field"
        placeholder="Type your question..."
        aria-label="Type your question"
      />
      <button type="submit" id="send-button" class="chat-input__send" aria-label="Send message">
        <!-- Simple paper-plane send icon, drawn as inline SVG so no image files are needed -->
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" aria-hidden="true">
          <path d="M3 12L21 4L13 21L11 13L3 12Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>
        </svg>
      </button>
    </form>

    <!-- Subtle footer label -->
    <p class="powered-by">Powered by RAG &middot; FAISS &middot; Gemini</p>

  </main>

  <script src="script.js"></script>
</body>
</html>
